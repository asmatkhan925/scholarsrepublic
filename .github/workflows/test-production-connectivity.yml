name: Test Production Tailscale Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connectivity:
    name: Tailscale SSH connectivity test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-ci
          ping: scholarsrepublic

      - name: Verify production server reachability
        run: tailscale ping scholarsrepublic

      - name: Verify Tailscale SSH
        run: |
          tailscale ssh scholarsrepublic@scholarsrepublic \
            'echo GITHUB_TAILSCALE_SSH_OK && whoami && hostname'
